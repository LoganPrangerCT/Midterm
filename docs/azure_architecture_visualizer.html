<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azure topology · Fantasy Draft Grader</title>
<style>
:root{color-scheme:dark;--ink:#eaf3ff;--muted:#91a9c1;--cyan:#78d6ff}*{box-sizing:border-box}body{margin:0;background:#070d16;color:var(--ink);font-family:Inter,"Segoe UI",sans-serif;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}.heading{height:64px;padding:0 4%;display:flex;align-items:center}.eyebrow{font:600 15px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase;margin:0}.canvas{position:relative;margin:0 3%;height:calc(100dvh - 146px);min-height:200px;overflow:hidden;border:1px solid #ffffff10;border-radius:18px;touch-action:none;background:radial-gradient(ellipse at 45% 45%,#102b43 0,transparent 67%),#080f1a;background-image:linear-gradient(#6384a508 1px,transparent 1px),linear-gradient(90deg,#6384a508 1px,transparent 1px);background-size:32px 32px;isolation:isolate}.camera{position:absolute;left:0;top:0;width:1200px;height:740px;transform-origin:0 0;will-change:transform;transition:transform 450ms cubic-bezier(.2,.8,.16,1)}.tile{position:absolute;border:1px solid color-mix(in srgb,var(--accent),transparent 52%);border-radius:12px;background:linear-gradient(125deg,color-mix(in srgb,var(--accent),#0b1624 91%),#0b1624 78%);box-shadow:0 16px 40px #0003;transform-origin:center center;transition:opacity 300ms,border-color 200ms;overflow:hidden;text-align:left}.tile.scope{background:transparent;border-style:dashed;box-shadow:none}.tile[role=button]{cursor:pointer}.tile[role=button]:hover{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent),transparent 65%),0 20px 50px #0004}.tile.hidden{visibility:hidden;opacity:0;pointer-events:none}.tile.muted{pointer-events:none}.tile .content{position:absolute;inset:0;padding:var(--pad,22px);pointer-events:none}.tile .kind{font:var(--small,9px) ui-monospace,Consolas,monospace;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.tile h2{font-size:var(--font,23px);font-weight:500;line-height:1.14;letter-spacing:-.035em;margin:8px 0}.tile p{font-size:var(--body,12px);line-height:1.6;color:#a9bfd3;margin:0;max-width:95%}.tile .enter{position:absolute;right:var(--pad,22px);bottom:var(--pad,22px);font-size:var(--small,9px);color:var(--accent)}.tile.ancestor .content{opacity:.55}.tile.ancestor p,.tile.ancestor .enter{display:none}.tile.ancestor h2{margin-top:5px}.tile.focus .enter{display:none}.tile.leaf{box-shadow:0 10px 25px #0002}.tile.leaf .enter{display:none}.footer{height:82px;padding:13px 4%;display:flex;justify-content:space-between;gap:15px;align-items:center}.crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.crumbs button{border:0;background:none;padding:4px 0;color:#8ba3bb;font-size:11px}.crumbs button:last-of-type{color:#ddf1ff}.crumbs span{color:#415870;font-size:11px}.actions{display:flex;gap:8px;flex-shrink:0}.actions button{border:1px solid #344e68;border-radius:8px;padding:8px 13px;background:#102034;font-size:11px}.actions button:disabled{opacity:.3;cursor:default}.hint{font-size:10px;color:#748da7;margin:7px 0 0}.sr-only{position:absolute;top:0;left:0;margin:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:650px){.heading{height:58px;padding:0 5%}.eyebrow{font-size:12px;letter-spacing:.08em}.canvas{height:calc(100dvh - 167px);margin:0 2%;border-radius:12px}.footer{height:109px;align-items:flex-start;padding-top:14px}.crumbs button{font-size:10px}.hint{max-width:240px;line-height:1.6}.actions button{padding:8px 10px}.tile{border-radius:8px}}
@media(prefers-reduced-motion:reduce){.camera,.tile{transition:none!important}}
</style></head><body>
<section class="heading"><h1 class="eyebrow">Azure / explore the topology</h1></section>
<main class="canvas" id="canvas" aria-label="Interactive nested Azure topology" tabindex="0"><div class="camera" id="camera"></div></main>
<footer class="footer"><div><nav class="crumbs" id="crumbs" aria-label="Topology path"></nav><p class="hint">Scroll or click to enter · scroll up to return · arrow keys work too</p></div><div class="actions"><button id="back" aria-label="Return to parent layer">↑ Back</button><button id="reset">Overview</button></div></footer>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p><noscript>This topology requires JavaScript. <a href="project.pdf">Read the project writeup</a>.</noscript>
<script>
(() => {
  // Fixed coordinates keep every revealed rectangle inside its actual parent boundary.
  const nodes = [
    {id:'azure',x:0,y:0,w:1200,h:740,title:'rg-fantasy-midterm',kind:'Resource group · North Central US',color:'#6f9cbf',scope:true,children:['plan','storage'],preferred:'plan'},
    {id:'plan',parent:'azure',x:25,y:95,w:850,h:615,title:'Linux · Basic B1',kind:'App Service plan',text:'Dedicated compute · one instance · Always On',color:'#74caff',children:['app'],preferred:'app'},
    {id:'storage',parent:'azure',x:900,y:95,w:275,h:260,title:'Host storage',kind:'Peer Azure resource',text:'StorageV2 · Standard_LRS\nAzureWebJobsStorage supports the host.',color:'#c1a3ff',children:['hostdata','storagekind','storagepurpose']},
    {id:'app',parent:'plan',x:60,y:220,w:780,h:455,title:'Azure Function App',kind:'fantasy-midterm-lpranger',text:'One deployed Python application',color:'#72dece',children:['host','worker'],preferred:'worker'},
    {id:'host',parent:'app',x:85,y:320,w:210,h:320,title:'Functions host',kind:'Azure runtime',text:'Receives your web request and sends it to the right Python code.',color:'#73caff',children:['dispatch','trigger','invoke']},
    {id:'worker',parent:'app',x:320,y:320,w:495,h:320,title:'Python worker',kind:'Python 3.12 · one process',text:'Routes, fantasy code and league state share this process.',color:'#a7a8ff',children:['api','fantasy','memory','files'],preferred:'fantasy'},
    {id:'api',parent:'worker',x:340,y:380,w:220,h:120,title:'HTTP routes',kind:'function_app.py',text:'API key · validation · responses',color:'#81c8ff',children:['leagues','league','reports']},
    {id:'fantasy',parent:'worker',x:575,y:380,w:220,h:120,title:'Fantasy code',kind:'fantasy/',text:'Import · grade · format',color:'#b8a2ff',children:['import','grading','format']},
    {id:'memory',parent:'worker',x:340,y:515,w:220,h:100,title:'League in memory',kind:'repository.py',text:'One full snapshot · cleared on restart',color:'#ffd08c',children:['snapshot','lifetime']},
    {id:'files',parent:'worker',x:575,y:515,w:220,h:100,title:'Rankings files',kind:'fantasy/data/',text:'Rankings deployed with the code',color:'#88dfba',children:['csv']},
    {id:'leagues',parent:'api',x:350,y:436,w:63,h:52,title:'GET / POST · leagues',kind:'Collection route',text:'Read or import',color:'#81c8ff'},
    {id:'league',parent:'api',x:418,y:436,w:63,h:52,title:'PUT / DELETE · {id}',kind:'League route',text:'Replace or clear',color:'#81c8ff'},
    {id:'reports',parent:'api',x:486,y:436,w:63,h:52,title:'POST · reports',kind:'Report route',text:'Grade a saved team',color:'#81c8ff'},
    {id:'import',parent:'fantasy',x:585,y:438,w:200,h:22,title:'Import Sleeper draft',kind:'Sleeper HTTPS',text:'Read and validate every team’s picks',color:'#b8a2ff'},
    {id:'grading',parent:'fantasy',x:585,y:463,w:200,h:22,title:'Grade saved picks',kind:'Local compute',text:'Saved picks + rankings CSV',color:'#b8a2ff'},
    {id:'format',parent:'fantasy',x:585,y:488,w:200,h:22,title:'Return JSON / text',kind:'Report response',text:'Computed on demand · no saved report',color:'#b8a2ff'},
    {id:'snapshot',parent:'memory',x:351,y:570,w:198,h:38,title:'All teams + draft picks',kind:'Volatile Python object',text:'One complete league · UUID + timestamps · defensive copies',color:'#ffd08c'},
    {id:'lifetime',parent:'memory',title:'Clears on process restart',kind:'Process lifetime',text:'Restarting or deploying clears the saved league.',color:'#ffd08c'},
    {id:'csv',parent:'files',x:586,y:570,w:94,h:38,title:'rankings.csv',kind:'Grading input',text:'Frozen player rankings',color:'#88dfba'},
    {id:'hostdata',parent:'storage',x:920,y:205,w:235,h:125,title:'AzureWebJobsStorage',kind:'Host connection',text:'Supports the Functions host.',color:'#c1a3ff'},
    {id:'storagekind',parent:'storage',title:'StorageV2 · Standard_LRS',kind:'Azure storage account',text:'Host infrastructure resource.',color:'#c1a3ff'},
    {id:'storagepurpose',parent:'storage',title:'Host support only',kind:'Data boundary',text:'League data stays in Python memory.',color:'#c1a3ff'},
    {id:'dispatch',parent:'host',x:100,y:430,w:180,h:180,title:'Receive request',kind:'Platform runtime',text:'An HTTPS call arrives.',color:'#73caff'},
    {id:'trigger',parent:'host',title:'Find API route',kind:'Runtime v4',text:'Choose the API handler.',color:'#73caff'},
    {id:'invoke',parent:'host',title:'Run Python',kind:'Language worker',text:'The code handles it.',color:'#73caff'}
  ];
  const byId = Object.fromEntries(nodes.map(n => [n.id,n]));
  for(const node of nodes){if(node.children)continue;const parent=byId[node.parent],index=parent.children.indexOf(node.id),roomy=node.parent==='host';Object.assign(node,{x:parent.x+10,y:parent.y+(roomy?55:38)+index*(roomy?66:25),w:parent.w-20,h:roomy?60:22})}
  const canvas = document.getElementById('canvas'), camera = document.getElementById('camera');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let path = ['azure'], focus = 'azure', busyUntil = 0, wheelAmount = 0, wheelTimer;
  const expanded = new Set(['azure']);
  const elements = {};
  for (const node of nodes) {
    const el = document.createElement('article');
    el.className = 'tile hidden' + (node.scope ? ' scope' : '') + (!node.children ? ' leaf' : '');el.dataset.node = node.id;
    el.style.setProperty('--accent',node.color);
    const content = document.createElement('div');content.className='content';
    for (const [tag,cls,value] of [['div','kind',node.kind],['h2','',node.title],['p','',node.text||''],['span','enter',node.children?'Scroll to explore ↘':'']]) {
      const part=document.createElement(tag);part.className=cls;part.textContent=value;part.style.whiteSpace=tag==='p'?'pre-line':'';
      if(tag==='h2'&&!node.children){part.replaceChildren();const number=document.createElement('span');number.textContent=String(byId[node.parent].children.indexOf(node.id)+1).padStart(2,'0');number.style.color=node.color;number.style.opacity='.65';const label=document.createElement('span');label.textContent=value;part.append(number,label);part.style.display='flex';part.style.gap='0.65em'}
      content.append(part);
    }
    el.append(content);camera.append(el);elements[node.id]=el;
    if(node.children){el.setAttribute('role','button');el.setAttribute('aria-label','Explore '+node.title);el.addEventListener('click',()=>enter(node.id));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();enter(node.id)}})}
  }
  function ancestry(id){const result=[];while(id){result.unshift(id);id=byId[id].parent}return result}
  function render(arriving=[]) {
    const root=byId[focus], cw=canvas.clientWidth,ch=canvas.clientHeight;
    const mobile=cw<650,children=root.children||[],positions={};
    const frame=mobile?{...root,h:root.w*(ch-36)/(cw-36)}:root;
    positions[focus]=frame;
    if(mobile){
      const cols=children.length===4?2:1,rows=Math.ceil(children.length/cols);
      children.forEach((id,i)=>positions[id]={x:frame.x+frame.w*(.045+(i%cols)*.48),y:frame.y+frame.h*(.23+Math.floor(i/cols)*(.72/rows)),w:frame.w*(cols===1?.91:.43),h:frame.h*(.72/rows-.035)});
    }
    const overviewScale=Math.min((cw-36)/byId.azure.w,(ch-36)/byId.azure.h);
    const depth=Math.min(path.length-1,4);
    const scale=mobile?Math.min((cw-36)/frame.w,(ch-36)/frame.h):overviewScale*(1+depth*.025);
    // Keep the full resource context in view; selection only nudges the camera toward its center.
    const centerX=600+(root.x+root.w/2-600)*.24,centerY=370+(root.y+root.h/2-370)*.24;
    const desiredX=(cw-byId.azure.w*scale)/2-(centerX-600)*scale;
    const minX=Math.min(18,cw-byId.azure.w*scale-18),maxX=Math.max(18,cw-byId.azure.w*scale-18);
    const tx=mobile?(cw-frame.w*scale)/2-frame.x*scale:Math.max(minX,Math.min(maxX,desiredX));
    const ty=mobile?(ch-frame.h*scale)/2-frame.y*scale:Math.max(-8,(ch-byId.azure.h*scale)/2-(centerY-370)*scale);
    camera.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
    const ancestors=ancestry(focus);
    for(const node of nodes){
      const el=elements[node.id],isAncestor=ancestors.includes(node.id),isChild=children.includes(node.id),visible=mobile?(isChild||node.id===focus):(node.id==='azure'||expanded.has(node.parent));
      const open=expanded.has(node.id)&&node.id!=='azure';
      el.classList.toggle('hidden',!visible);el.classList.toggle('ancestor',open&&node.id!==focus);el.classList.toggle('focus',node.id===focus);el.classList.toggle('muted',isAncestor);
      el.tabIndex=visible&&!isAncestor&&node.children?0:-1;el.setAttribute('aria-hidden',String(!visible));
      if(node.children)el.setAttribute('aria-expanded',String(expanded.has(node.id)));
      const box=positions[node.id]||node;
      Object.assign(el.style,{left:box.x+'px',top:box.y+'px',width:box.w+'px',height:box.h+'px'});
      const sw=box.w*scale,sh=box.h*scale;
      const compact=!mobile&&(sw<150||sh<100),pipeline=!mobile&&!node.children;
      const detailParent=node.children?.every(id=>!byId[id].children);
      const host=node.id==='host',hostDetail=pipeline&&node.parent==='host';
      const font=host?Math.min(20,sw/7.5):pipeline?Math.min(hostDetail?14:12,sh*.6):Math.min(open&&(sh<170||detailParent)?16:isChild?(mobile?20:25):21,Math.max(10,sw/10),sh/4.5);
      el.style.borderWidth='0';el.style.borderRadius=(pipeline?4:12)/scale+'px';
      el.style.boxShadow=pipeline?'none':`inset 0 0 0 ${1/scale}px color-mix(in srgb,${node.color},transparent 45%),0 ${12/scale}px ${30/scale}px #0002`;
      el.querySelector('.kind').style.display=compact||pipeline||(open&&(sh<170||detailParent))?'none':'';
      el.querySelector('h2').style.margin=`${(compact||open?0:mobile?5:8)/scale}px 0 ${(compact||open?0:mobile?5:9)/scale}px`;
      el.style.setProperty('--font',font/scale+'px');el.style.setProperty('--body',(host?14:hostDetail?10.5:Math.min(mobile?10:12,Math.max(9,sw/23)))/scale+'px');el.style.setProperty('--small',Math.min(mobile?8:9,Math.max(7,sw/28))/scale+'px');el.style.setProperty('--pad',Math.min(pipeline?4:compact||open?9:mobile?12:23,Math.max(6,sw*.055))/scale+'px');
      el.querySelector('p').style.display=hostDetail||(!open&&isChild&&sh>95)?'':'none';el.querySelector('.enter').style.display=!open&&isChild&&node.children&&sh>140?'':'none';
      if(arriving.includes(node.id)&&!reduced.matches)el.animate([{transform:`translateY(${-24/scale}px)`,opacity:0},{transform:'translateY(0)',opacity:1}],{duration:450,delay:children.indexOf(node.id)*40,easing:'cubic-bezier(.18,.78,.18,1)',fill:'backwards'});
    }
    const crumbs=document.getElementById('crumbs');crumbs.replaceChildren();
    path.forEach((id,i)=>{if(i){const sep=document.createElement('span');sep.textContent='›';crumbs.append(sep)}const b=document.createElement('button');b.textContent=id==='azure'?'Azure':byId[id].title;b.addEventListener('click',()=>navigate(i));crumbs.append(b)});
    document.getElementById('back').disabled=path.length===1;document.getElementById('announcement').textContent=root.title+'. '+children.map(id=>byId[id].title).join(', ');
  }
  function enter(id){const node=byId[id];if(!node?.children||id===focus||elements[id].classList.contains('hidden'))return;const arriving=expanded.has(id)?[]:node.children;path=ancestry(id);path.forEach(key=>expanded.add(key));focus=id;busyUntil=performance.now()+(reduced.matches?0:600);render(arriving);canvas.focus({preventScroll:true})}
  function navigate(index){if(index<0)return;path=path.slice(0,index+1);focus=path.at(-1);busyUntil=performance.now()+(reduced.matches?0:450);render()}
  function back(){if(path.length===1)return;for(const id of expanded)if(ancestry(id).includes(focus))expanded.delete(id);navigate(path.length-2)}
  function reset(){expanded.clear();expanded.add('azure');navigate(0)}
  function forward(target){const hovered=target?.closest?.('[data-node]')?.dataset.node,root=byId[focus];if(hovered&&!path.includes(hovered)){enter(hovered);return}enter(root.preferred||root.children?.find(id=>byId[id].children))}
  canvas.addEventListener('wheel',e=>{e.preventDefault();if(performance.now()<busyUntil)return;wheelAmount+=e.deltaY*(e.deltaMode===1?16:1);clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>wheelAmount=0,180);if(Math.abs(wheelAmount)<45)return;const direction=wheelAmount;wheelAmount=0;direction>0?forward(e.target):back()},{passive:false});
  document.getElementById('back').addEventListener('click',back);document.getElementById('reset').addEventListener('click',reset);
  addEventListener('keydown',e=>{if(e.target.closest('button,a')||e.defaultPrevented)return;if(['ArrowDown','PageDown','ArrowUp','PageUp','Escape','Home',' '].includes(e.key)){e.preventDefault();if(e.key==='Home')reset();else if(['ArrowUp','PageUp','Escape'].includes(e.key)||e.shiftKey)back();else forward(document.activeElement)}});
  let touchY=0;canvas.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const delta=touchY-e.changedTouches[0].clientY;if(Math.abs(delta)>40&&performance.now()>=busyUntil)delta>0?forward(e.target):back()},{passive:true});
  new ResizeObserver(()=>render()).observe(canvas);render(['plan','storage']);
})();
</script></body></html>
