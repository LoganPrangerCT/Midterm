</head>
<body class="min-h-screen flex flex-col bg-[#07090e] text-slate-200">

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800/80 bg-[#0c101b]/90 backdrop-blur-md px-5 py-2 flex items-center justify-center sticky top-0 z-50 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
    <div class="page-title"><strong>Fantasy Draft Grader</strong><span>From league import to report card</span></div>
    <!-- Center Playback Controls -->
    <div class="flex items-center gap-2">
      <div class="bg-slate-900/90 px-1.5 py-1 rounded-xl border border-slate-800 flex items-center space-x-1.5 shadow-inner">
        <button id="btnPlay" class="px-3.5 py-1 rounded-lg text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 hover:brightness-110 transition flex items-center gap-1.5 shadow-[0_0_12px_rgba(16,185,129,0.4)]">
          <span id="playIcon">▶</span>
          <span id="playText">Play Story</span>
        </button>
        <button id="btnPrev" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Previous Step" aria-label="Previous step">◀</button>
        <button id="btnNext" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Next Step" aria-label="Next step">▶</button>
        <button id="btnReset" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Reset Trace" aria-label="Reset trace">↺</button>
      </div>
    </div>
  </header>

  <!-- Main Pipeline Visualizer + Live Step details & payload -->
  <div id="viewFlow" class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 overflow-hidden">
    
    <!-- Left: Canvas Area (8 cols) -->
    <section class="lg:col-span-8 flex flex-col relative h-[500px] lg:h-[calc(100vh-65px)] border-b lg:border-b-0 lg:border-r border-slate-800/80 bg-[#07090e] bg-grid select-none">
      
      <!-- Current Step Banner -->
      <div class="step-banner">
        <div class="bg-slate-900/90 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-slate-700/80 shadow-[0_8px_25px_rgba(0,0,0,0.6)] flex items-center space-x-3 pointer-events-auto">
          <span id="stepNumberBadge" class="w-6 h-6 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 text-slate-950 text-xs font-black flex items-center justify-center shadow-[0_0_10px_rgba(6,182,212,0.5)]">1</span>
          <div>
            <div id="stepPhaseTitle" class="text-[10px] font-bold uppercase tracking-wider text-cyan-400">Step 1 of 7</div>
            <div id="stepActionTitle" class="text-xs font-bold text-white tracking-tight">Import a league</div>
          </div>
        </div>
      </div>

      <!-- Main Canvas -->
      <div class="request-route" aria-label="Story sequence"><span>Import league</span><b>→</b><span>Ask Sleeper</span><b>→</b><span>Receive picks</span><b>→</b><span>Save league</span><b>→</b><span>Choose team</span><b>→</b><span>Grade picks</span><b>→</b><span>Report card</span></div><div class="map-scroll"><svg id="architectureMap" viewBox="0 50 1280 735" role="group" aria-label="Application topology. Select a component to inspect its trace step."></svg></div>

      <!-- Bottom Interactive Progress Scrubber -->
      <div class="p-3 bg-[#0a0d17]/95 border-t border-slate-800/80 backdrop-blur-md flex flex-col gap-2 z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.4)]">
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span class="flex items-center gap-2">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
            </span>
            <span class="text-[11px] font-semibold text-slate-300">Story Timeline</span>
          </span>
          <span id="stepCounterText" class="code-font text-[11px] text-cyan-300 font-bold bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/50">Step 1 of 7</span>
        </div>

        <!-- Clean Interactive Slider Track -->
        <div class="relative w-full flex items-center h-4 cursor-pointer" id="progressTrackArea" role="slider" tabindex="0" aria-label="Story step" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" title="Click or drag to jump to any step">
          <div class="w-full h-2 bg-slate-800/90 rounded-full overflow-hidden shadow-inner relative border border-slate-700/40">
            <div id="progressFill" class="h-full bg-gradient-to-r from-cyan-500 via-emerald-400 to-indigo-500 w-[14.29%] transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.7)]"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="panelDivider" class="panel-divider" role="separator" tabindex="0" aria-label="Resize details panel" aria-orientation="vertical" aria-controls="detailsPanel" aria-valuemin="310" aria-valuemax="1000" aria-valuenow="370" title="Drag to resize · click to expand or restore details"><span aria-hidden="true">‹</span></div>
    <!-- Right: Clean Live Step details & payload (4 cols) -->
    <aside id="detailsPanel" class="lg:col-span-4 flex flex-col h-[520px] lg:h-[calc(100vh-65px)] bg-[#0a0d17]/95 border-slate-800 overflow-hidden">
      
      <!-- Right Pane Header -->
      <div id="detailsHeader" class="px-4 py-3 border-b border-slate-800/80 bg-[#0d1220] flex items-center justify-between sticky top-0 z-30 shadow-md">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)] animate-pulse"></span>
          <span class="text-xs font-bold text-white uppercase tracking-wider">Step details & payload</span>
          <span id="componentLabel" class="text-[10px] text-slate-400 code-font bg-slate-800/90 px-2 py-0.5 rounded border border-slate-700/60 ml-1">Client ➔ Azure</span>
        </div>
        <button id="expandDetails" class="panel-expand" aria-expanded="false" aria-controls="detailsPanel" title="Expand details panel">Expand ↗</button><div id="payloadViewSwitcher" class="flex items-center gap-1.5">
          <span id="payloadFormatBadge" class="text-[10px] code-font px-2.5 py-0.5 rounded-full bg-cyan-950/80 text-cyan-300 border border-cyan-700/60 font-semibold shadow-[0_0_8px_rgba(6,182,212,0.3)]">HTTP Request</span>
        </div>
      </div>

      <div class="trace-description" aria-live="polite"><div id="traceDirection" class="trace-direction"></div><h2 id="traceTitle"></h2><p id="traceSummary"></p><p class="rule" id="traceRule"></p></div>
      <!-- Full-Height Live Code/JSON Box -->
      <div class="p-3.5 flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 rounded-xl border border-cyan-500/20 bg-[#05070d] p-3.5 text-xs code-font text-slate-200 overflow-x-auto overflow-y-auto shadow-[inset_0_0_20px_rgba(0,0,0,0.85)] leading-relaxed">
          <pre id="payloadCodeView" class="text-[11.5px] text-cyan-200/90 whitespace-pre"><code>{}</code></pre>
        </div>
      </div>
    </aside>
  </div>

    "actionSummary": "Return loganpranger’s report card: the overall grade, biggest wins, biggest reaches and every draft pick.",
    "ruleText": "Reports are calculated on demand and never saved. View the readable report or its JSON response excerpt.",
    "fromNode": "azure",
    "toNode": "client",
    "packetLabel": "200 OK + report → caller",
    "format": "Report Output",
    "label": "Report card",
    "component": "azure → client",
    "payload": {
      "status": 200,
      "headers": {
        "Content-Type": "application/json",
        "Cache-Control": "no-store",
        "Vary": "Accept"
      },
      "body": {
        "teamName": "loganpranger",
        "season": 2026,
        "source": {
          "provider": "sleeper",
          "leagueId": "1391859959213359104",
          "rosterId": 8
        },
        "draftGrade": "C",
        "evaluation": {
          "totalSurplus": 25.7,
          "averageSurplus": 1.977,
          "letterGrade": "C",
          "provisional": true,
          "pickCount": 15,
          "gradedPickCount": 13,
          "ignoredPickCount": 2,
          "bestPicks": [
            {
              "player": "Matthew Golden",
              "surplus": 66.6
            },
            {
              "player": "Bhayshul Tuten",
              "surplus": 39.0
            },
            {
              "player": "Jordyn Tyson",
              "surplus": 10.6
            }
          ],
          "worstPicks": [
            {
              "player": "Chase Brown",
              "surplus": -42.2
            },
            {
              "player": "Jonathon Brooks",
              "surplus": -19.0
            },
            {
              "player": "DeVonta Smith",
              "surplus": -11.6
            }
          ]
        }
      }
    },
    "rawReport": ACTUAL_REPORT_TEXT
  }
];

    const NODES = {
      client:{id:'client',name:'Caller / API client',sub:'League import & reports',file:'Outside Azure',x:110,y:470,w:190,h:104,color:'#38bdf8'},
      azure:{id:'azure',name:'HTTP request handler',sub:'Route, parse & respond',file:'function_app.py',x:415,y:470,w:240,h:104,color:'#60a5fa'},
      auth:{id:'auth',name:'API key check',sub:'Wrong or missing key → 401',file:'Inside function_app.py',x:415,y:300,w:240,h:96,color:'#fbbf24'},
      store:{id:'store',name:'Saved league memory',sub:'One league · all team picks',file:'repository.py',x:415,y:635,w:240,h:104,color:'#fb923c'},
      sleeper:{id:'sleeper',name:'Sleeper REST API',sub:'League, roster & draft picks',file:'External · HTTPS GET only',x:1135,y:255,w:240,h:108,color:'#34d399'},
      grader:{id:'grader',name:'fantasy backend',sub:'Import → validate → grade',file:'fantasy/ modules',x:800,y:470,w:270,h:104,color:'#c084fc'},
      rankings:{id:'rankings',name:'rankings.csv',sub:'Frozen 2026 comparison data',file:'fantasy/data/rankings.csv',x:800,y:635,w:270,h:104,color:'#f472b6'}
    };
    const PIPES = [
      {from:'client',to:'azure',d:'M205 455 H295',back:'M295 485 H205',label:'POST',lx:250,ly:440,returnLabel:'200 / 201',rx:250,ry:506},
      {from:'azure',to:'auth',d:'M400 418 V348',back:'M430 348 V418',label:'Check key',lx:353,ly:385,returnLabel:'Key OK',rx:477,ry:385},
      {from:'grader',to:'sleeper',d:'M935 445 H975 V255 H1015',back:'M1015 280 H955 V430 H935',label:'GET data',lx:930,ly:235,returnLabel:'League + picks',rx:1080,ry:337},
      {from:'azure',to:'grader',d:'M535 455 H665',back:'M665 485 H535',label:'Import / grade',lx:600,ly:440,returnLabel:'Graded report',rx:600,ry:506},
      {from:'grader',to:'rankings',d:'M785 522 V583',back:'M815 583 V522',label:'Lookup',lx:745,ly:556,returnLabel:'Ranks',rx:867,ry:556},
      {from:'azure',to:'store',d:'M400 522 V583',back:'M430 583 V522',label:'Save',lx:370,ly:556,returnLabel:'League copy',rx:471,ry:556}
    ];
    const map = document.getElementById('architectureMap');
    let currentStep=0,isPlaying=false,animProgress=0,lastTime=performance.now();
    const escapeXml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
    function drawTopology(){
      const step=STEPS[currentStep];
      let activePath='';
      const edges=PIPES.map(pipe=>{
        return [{from:pipe.from,to:pipe.to,d:pipe.d,label:pipe.label,x:pipe.lx,y:pipe.ly,returning:false},
          {from:pipe.to,to:pipe.from,d:pipe.back,label:pipe.returnLabel,x:pipe.rx,y:pipe.ry,returning:true}].map(edge=>{
          const active=step.fromNode===edge.from&&step.toNode===edge.to;
          if(active)activePath=edge.d;
          return `<path data-from="${edge.from}" data-to="${edge.to}" class="map-edge${edge.returning?' return':''}${active?' active':''}" style="--edge-color:${NODES[step.toNode].color}" d="${edge.d}" marker-end="url(#${active?'activeArrow':'arrow'})"/><text class="edge-label" text-anchor="middle" x="${edge.x}" y="${edge.y}">${edge.label}</text>`;
        }).join('');
      }).join('');
      const cards=Object.values(NODES).map(node=>{
        const active=node.id===step.fromNode||node.id===step.toNode;
        const x=node.x-node.w/2,y=node.y-node.h/2;
        const sub=node.id==='azure'&&[2,3,6].includes(step.id)?'Waiting for fantasy':node.id==='grader'&&step.toNode==='sleeper'?'Waiting for Sleeper’s response':node.sub;
        return `<g class="map-node" role="button" tabindex="0" data-node="${node.id}" aria-label="${escapeXml(node.name)}. ${escapeXml(node.sub)}" aria-pressed="${active}" style="--node-color:${node.color}"><rect class="card" x="${x}" y="${y}" width="${node.w}" height="${node.h}" rx="12" fill="${active?'#14243a':'#101b2b'}" stroke="${node.color}66"/><rect x="${x+12}" y="${y+15}" width="4" height="14" rx="2" fill="${node.color}"/><text class="node-title" x="${x+24}" y="${y+27}">${node.name}</text><text class="node-sub" x="${x+14}" y="${y+49}">${escapeXml(sub)}</text><text class="node-file" x="${x+14}" y="${y+node.h-15}">${node.file}</text></g>`;
      }).join('');
      map.innerHTML=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718ba8"/></marker><marker id="activeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="${NODES[step.toNode].color}"/></marker></defs>
      <rect x="245" y="65" width="740" height="700" rx="20" fill="#0b1524" stroke="#3b628b"/>
      <text x="275" y="150" class="map-caption">App Service plan: Linux B1 · one instance</text>
      <rect x="275" y="185" width="280" height="525" rx="14" fill="#10213755" stroke="#4b6e94" stroke-dasharray="5 5"/>
      <text x="295" y="210" fill="#93c5fd" font-size="15" font-weight="600">HTTP & memory</text>
      <text x="295" y="232" class="map-caption">Routes, key checks & saved league</text>
      <rect x="635" y="350" width="330" height="360" rx="14" fill="#241c3455" stroke="#a477bd" stroke-dasharray="5 5"/>
      <text x="655" y="377" fill="#d8b4fe" font-size="15" font-weight="600">fantasy/ folder</text>
      <text x="655" y="399" class="map-caption">Importing, grading & rankings data</text>
      <text x="110" y="390" text-anchor="middle" class="map-caption">CALLER · OUTSIDE THE APP</text><text x="1135" y="173" text-anchor="middle" class="map-caption">EXTERNAL SERVICE</text>
      ${edges}${cards}
      <text x="415" y="741" text-anchor="middle" class="map-caption">Saved league clears on restart.</text>
      <text x="800" y="741" text-anchor="middle" class="map-caption">This folder is part of the app.</text>
      ${step.fromNode===step.toNode?`<rect x="${NODES[step.toNode].x-NODES[step.toNode].w/2+8}" y="${NODES[step.toNode].y-NODES[step.toNode].h/2+8}" width="${NODES[step.toNode].w-16}" height="${NODES[step.toNode].h-16}" rx="8" fill="none" stroke="${NODES[step.toNode].color}" opacity=".5"><animate attributeName="opacity" values=".15;.65;.15" dur="2s" repeatCount="indefinite"/></rect>`:''}
      ${activePath?`<circle id="trace-packet" r="4" fill="white"><animateMotion dur="3s" repeatCount="indefinite" path="${activePath}"/></circle>`:''}`;
    }
    map.addEventListener('click',event=>{
      const node=event.target.closest('[data-node]');if(!node)return;
      const index=node.dataset.node==='auth'?0:STEPS.findIndex(step=>step.toNode===node.dataset.node);
      if(index>=0){isPlaying=false;playText.textContent='Play Story';playIcon.textContent='▶';setStep(index)}
    });
    map.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){if(event.target.matches('[data-node]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}});
    function render(time){
      const delta=Math.min((time-lastTime)/1000,.1);lastTime=time;
      if(isPlaying){animProgress+=delta*.24;if(animProgress>=1){animProgress=0;setStep((currentStep+1)%STEPS.length)}}
      requestAnimationFrame(render);
    }

    const progressFill = document.getElementById('progressFill');
    const progressTrackArea = document.getElementById('progressTrackArea');

    function setStep(idx) {
      if (idx < 0 || idx >= STEPS.length) return;
      currentStep = idx;
      animProgress = 0;
      updateUI();
    }

    let reportViewMode = 'ascii';

    function updateUI() {
      const step = STEPS[currentStep];
      document.getElementById('traceTitle').textContent=step.title;
      document.getElementById('traceSummary').textContent=step.actionSummary;
      document.getElementById('traceRule').textContent=step.ruleText;
      const phase=currentStep;
      document.querySelectorAll('.request-route span').forEach((el,i)=>{if(i===phase)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
      drawTopology();

      document.getElementById('stepNumberBadge').textContent = step.id;
      document.getElementById('stepPhaseTitle').textContent = `Step ${step.id} of ${STEPS.length}`;
      document.getElementById('stepActionTitle').textContent = step.title;
      document.getElementById('stepCounterText').textContent = `Step ${step.id} of ${STEPS.length}`;

      const percent = ((currentStep + 1) / STEPS.length) * 100;
      progressFill.style.width = `${percent}%`;
      progressTrackArea.setAttribute('aria-valuemax',String(STEPS.length));
      progressTrackArea.setAttribute('aria-valuenow',String(step.id));
      progressTrackArea.setAttribute('aria-valuetext',`Step ${step.id}: ${step.title}`);

      document.getElementById('componentLabel').textContent = step.fromNode===step.toNode ? `Within ${NODES[step.toNode].name}` : `${NODES[step.fromNode].name} → ${NODES[step.toNode].name}`;
      document.getElementById('traceDirection').textContent=step.packetLabel; 

      const codeView = document.getElementById('payloadCodeView');
      const toggleContainer = document.getElementById('payloadViewSwitcher');

      if (step.id === STEPS.length) {
        toggleContainer.innerHTML = `
          <div class="flex items-center bg-slate-900/90 rounded-lg p-0.5 border border-slate-700/80">
            <button id="btnToggleAscii" class="text-[10px] code-font px-2 py-0.5 rounded transition ${reportViewMode === 'ascii' ? 'bg-cyan-950 text-cyan-300 font-bold border border-cyan-800/80 shadow-[0_0_6px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white'}">Report Card</button>
            <button id="btnToggleJson" class="text-[10px] code-font px-2 py-0.5 rounded transition ${reportViewMode === 'json' ? 'bg-cyan-950 text-cyan-300 font-bold border border-cyan-800/80 shadow-[0_0_6px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white'}">JSON</button>
          </div>
        `;

        document.getElementById('btnToggleAscii').onclick = () => {
          reportViewMode = 'ascii';
          updateUI();
        };
        document.getElementById('btnToggleJson').onclick = () => {
          reportViewMode = 'json';
          updateUI();
        };

        if (reportViewMode === 'ascii') {
          codeView.textContent = step.rawReport;
        } else {
          codeView.textContent = JSON.stringify(step.payload, null, 2);
        }
      } else {
        toggleContainer.innerHTML = `<span id="payloadFormatBadge" class="text-[10px] code-font px-2.5 py-0.5 rounded-full bg-cyan-950/80 text-cyan-300 border border-cyan-700/60 font-semibold shadow-[0_0_8px_rgba(6,182,212,0.3)]">${step.format}</span>`;
        codeView.textContent = JSON.stringify(step.payload, null, 2);
      }
    }

    function handleScrubberEvent(e) {
      const rect = progressTrackArea.getBoundingClientRect();
      const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const ratio = clickX / rect.width;
      const targetStep = Math.min(STEPS.length - 1, Math.floor(ratio * STEPS.length));
      setStep(targetStep);
    }
    progressTrackArea.addEventListener('click', handleScrubberEvent);
    progressTrackArea.addEventListener('keydown',event=>{let index=currentStep;if(event.key==='ArrowRight')index++;else if(event.key==='ArrowLeft')index--;else if(event.key==='Home')index=0;else if(event.key==='End')index=STEPS.length-1;else return;event.preventDefault();setStep(index)});

    const btnPlay = document.getElementById('btnPlay');
    const playText = document.getElementById('playText');
    const playIcon = document.getElementById('playIcon');

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playText.textContent = isPlaying ? "Pause" : "Play Story";
      playIcon.textContent = isPlaying ? "⏸" : "▶";
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      isPlaying = false;
      playText.textContent = "Play Story";
      playIcon.textContent = "▶";
      if (currentStep < STEPS.length - 1) setStep(currentStep + 1);
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      isPlaying = false;
      playText.textContent = "Play Story";
      playIcon.textContent = "▶";
      if (currentStep > 0) setStep(currentStep - 1);
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      isPlaying = false;
      playText.textContent = "Play Story";
      playIcon.textContent = "▶";
      setStep(0);
    });


    const flow=document.getElementById('viewFlow'),details=document.getElementById('detailsPanel'),divider=document.getElementById('panelDivider'),expandDetails=document.getElementById('expandDetails');
    const smallScreen=matchMedia('(max-width:850px)');
    let expanded=false,restoreWidth=null,dragStart=null,didDrag=false;
    function panelLimits(){return {min:310,max:Math.max(310,flow.clientWidth-190)}}
    function setPanelWidth(width){
      const limits=panelLimits(),value=Math.round(Math.max(limits.min,Math.min(limits.max,width)));
      flow.style.setProperty('--details-width',value+'px');
      divider.setAttribute('aria-valuemin',limits.min);divider.setAttribute('aria-valuemax',limits.max);divider.setAttribute('aria-valuenow',value);
      divider.setAttribute('aria-valuetext',value+' pixels for details');
    }
    function updatePanelState(){
      flow.classList.toggle('details-focus',expanded);expandDetails.textContent=expanded?'Restore ↙':'Expand ↗';expandDetails.setAttribute('aria-expanded',String(expanded));
      divider.querySelector('span').textContent=expanded?'›':'‹';
      flow.querySelector('section').inert=expanded&&smallScreen.matches;
    }
    function toggleDetails(){
      if(!expanded){restoreWidth=details.getBoundingClientRect().width;expanded=true;if(!smallScreen.matches)setPanelWidth(flow.clientWidth*.8)}
      else{expanded=false;if(restoreWidth!==null)setPanelWidth(restoreWidth)}
      updatePanelState();
    }
    expandDetails.addEventListener('click',toggleDetails);
    divider.addEventListener('pointerdown',event=>{if(event.button!==0)return;didDrag=false;dragStart={x:event.clientX,width:details.getBoundingClientRect().width};divider.setPointerCapture(event.pointerId)});
    divider.addEventListener('pointermove',event=>{
      if(!dragStart)return;const delta=dragStart.x-event.clientX;if(!didDrag&&Math.abs(delta)<4)return;
      didDrag=true;expanded=false;document.body.classList.add('resizing');setPanelWidth(dragStart.width+delta);updatePanelState();
    });
    function endResize(){dragStart=null;document.body.classList.remove('resizing')}
    divider.addEventListener('pointerup',endResize);divider.addEventListener('pointercancel',()=>{didDrag=true;endResize()});divider.addEventListener('lostpointercapture',endResize);
    divider.addEventListener('click',()=>{if(didDrag){didDrag=false;return}toggleDetails()});
    divider.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleDetails();return}
      const limits=panelLimits(),width=details.getBoundingClientRect().width;
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      event.preventDefault();expanded=false;setPanelWidth(event.key==='Home'?limits.min:event.key==='End'?limits.max:width+(event.key==='ArrowLeft'?40:-40));updatePanelState();
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&expanded)toggleDetails()});
    window.addEventListener('resize',()=>{if(!smallScreen.matches){if(expanded)setPanelWidth(flow.clientWidth*.8);else if(flow.style.getPropertyValue('--details-width'))setPanelWidth(details.getBoundingClientRect().width)}updatePanelState()});
    setPanelWidth(details.getBoundingClientRect().width);

    updateUI();
    requestAnimationFrame(render);
  </script>
</body>
</html>
